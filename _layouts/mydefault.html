<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection Builder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        .collection-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px auto;
            max-width: 800px;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        img {
            max-width: 200px;
            height: auto;
            border-radius: 5px;
        }
        iframe {
            width: 300px;
            height: 400px;
            border: none;
        }
    </style>
</head>
<body>
    <h1>Jason</h1>
    <div class="collection-item">
        <img src="https://strikerz45.github.io/Coin-op/objects/Jason_MugShot.JPG" alt="Collection Item">
        <iframe src="https://strikerz45.github.io/Coin-op/objects/Jason_Camberis_Transcription.pdf"></iframe>
    </div>
</body>
</html>
